name: Advancement const initialization reverse comparison

on:
  push:
    branches:
      - codex/advancement-const-20261002

permissions:
  contents: read

concurrency:
  group: advancement-const-20261002
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'Sandvoxel/Pumpkin'
    uses: ./.github/workflows/advancement-diagnostic-build.yml
    with:
      variant: candidate
  baseline:
    needs: candidate
    if: github.repository == 'Sandvoxel/Pumpkin'
    uses: ./.github/workflows/advancement-diagnostic-build.yml
    with:
      variant: baseline
